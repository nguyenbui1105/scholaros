[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scholaros"
version = "0.2.0"
description = "Evidence-first scholarship eligibility and application research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ScholarOS Contributors"}]
dependencies = ["pydantic>=2.9,<3", "cryptography>=43", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11",
       "hypothesis>=6", "types-PyYAML>=6", "pip-audit>=2", "pre-commit>=4"]
llm = ["openai>=1.0"]
web = []

[project.scripts]
scholaros = "scholaros.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["scholaros"]
