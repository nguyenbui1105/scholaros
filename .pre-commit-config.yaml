repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: skill-contracts
        name: Verify skill status references
        entry: python scripts/verify_skills.py
        language: system
        pass_filenames: false
