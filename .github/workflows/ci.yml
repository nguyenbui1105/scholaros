name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Strict typing
        run: mypy --strict src/
      - name: Skill contract consistency
        run: python scripts/verify_skills.py
      - name: Offline tests with 85% minimum coverage
        run: pytest -q --cov=scholaros --cov-report=term-missing --cov-fail-under=85
      - name: Labeled synthetic benchmark
        run: python -m scholaros.benchmark
      - name: Offline ingest/extract/match p50-p95 benchmark
        run: python -m scholaros perf --repetitions 100 --json
      - name: End-to-end synthetic demo
        run: python -m scholaros demo --json
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and audit CLI with patched packaging toolchain
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0"
          python -m pip install -e ".[dev]"
      - name: Audit installed dependencies
        run: pip-audit
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
