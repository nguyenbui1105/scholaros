name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Strict typing
        run: mypy --strict src/
      - name: Offline tests and coverage
        run: pytest -q --cov=scholaros --cov-report=term-missing
      - name: End-to-end synthetic demo
        run: python -m scholaros demo --json
