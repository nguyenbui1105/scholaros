name: v0.8 one-time formatting
on:
  push:
    paths:
      - .github/workflows/v08-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/v08-discovery-inbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v08-discovery-inbox
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.17.5
      - name: Ruff lint fixes and formatting
        run: |
          ruff check --fix src tests
          ruff format src tests
      - name: Commit format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style(v0.8): autoformat discovery inbox"
            git push origin HEAD:feat/v08-discovery-inbox
          fi
