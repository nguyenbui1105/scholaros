name: v0.7 one-time Ruff formatting
on:
  push:
    paths:
      - .github/workflows/v07-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/v07-cited-profile-triage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v07-cited-profile-triage
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.17.5
      - name: Correct lint and formatting
        run: |
          ruff check --fix src tests
          ruff format src tests
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style(v0.7): Ruff formatting"
            git push origin HEAD:feat/v07-cited-profile-triage
          fi

# Re-run after syntax repair
