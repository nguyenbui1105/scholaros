name: One-time agent workspace formatter
on:
  push:
    paths:
      - '.github/workflows/format-agent-once.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/agent-application-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-application-workspace
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.17.5
      - name: Format changed Python
        run: |
          ruff check --fix src tests
          ruff format src tests
      - name: Commit only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff formatting to agent workspace"
            git push origin HEAD:feat/agent-application-workspace
          fi
