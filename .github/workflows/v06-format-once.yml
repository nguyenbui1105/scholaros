name: v0.6 one-time format
on:
  push:
    paths:
      - '.github/workflows/v06-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/v06-real-source-intake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v06-real-source-intake
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.17.5
      - name: Ruff autofix and formatting
        run: |
          ruff check --fix src tests
          ruff format src tests
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style(v0.6): apply Ruff formatting"
            git push origin HEAD:feat/v06-real-source-intake
          fi

# Re-run formatter after application dashboard integration
