name: v0.3.1 one-time format
on:
  push:
    paths:
      - .github/workflows/v031-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/v031-evaluation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v031-evaluation
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.17.5
      - name: Autoformat only source and tests
        run: |
          ruff check --fix src tests
          ruff format src tests
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style(v0.3.1): format evaluation sources and tests"
            git push origin HEAD:feat/v031-evaluation
          fi
