name: Publish verified v0.2.0 release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate release version
        run: |
          python - <<'PY'
          import pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert version == "0.2.0", f"Expected 0.2.0, got {version}"
          assert '0.2.0' in pathlib.Path("src/scholaros/__init__.py").read_text()
          PY
      - name: Publish tagged release only once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists; no action."
          else
            gh release create v0.2.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT_SHA" \
              --title "ScholarOS v0.2.0 — Offline Synthetic Beta" \
              --notes-file docs/RELEASE_NOTES_0.2.0.md
          fi
