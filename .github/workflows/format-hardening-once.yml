name: One-time eligibility hardening formatter
on:
  push:
    paths:
      - '.github/workflows/format-hardening-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Ruff import/format rules
        run: |
          python -m pip install ruff==0.17.5
          ruff check --fix src tests
          ruff format src tests
      - name: Commit only actual formatting differences
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: autoformat eligibility hardening and benchmark"
            git push origin HEAD:main
          fi
